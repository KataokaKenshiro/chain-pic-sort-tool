[project]
name = "chain-pic-sort"
version = "0.1.0"
description = "検査画像を目視で OK/NG/SKIP/END に振り分けるデスクトップツール"
readme = "README.md"
authors = [
    { name = "KataokaKenshiro", email = "k.kataoka@garm.co.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
]

[project.scripts]
chain-pic-sort = "chain_pic_sort.app:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
files = ["src", "tests"]
